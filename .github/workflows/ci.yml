name: AENV CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.rs"
      - "Makefile"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/install.sh"
      - "scripts/run-with-capabilities.sh"
      - "scripts/tests/setup-ublk-access.sh"
      - "scripts/tests/verify-capability-runner.sh"
      - "scripts/tests/verify-install-service.sh"
      - "scripts/tests/verify-container-supply-chain.py"
      - "deploy/docker/**"
      - "tools-image/**"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"
  push:
    paths:
      - "**.rs"
      - "Makefile"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/install.sh"
      - "scripts/run-with-capabilities.sh"
      - "scripts/tests/setup-ublk-access.sh"
      - "scripts/tests/verify-capability-runner.sh"
      - "scripts/tests/verify-install-service.sh"
      - "scripts/tests/verify-container-supply-chain.py"
      - "deploy/docker/**"
      - "tools-image/**"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"

jobs:
  guest-init:
    runs-on: depot-ubuntu-22.04-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools-image/agentenv-init/go.mod
          cache-dependency-path: tools-image/agentenv-init/go.sum
      - name: Check guest init
        run: make -C tools-image check
      - name: Verify container supply chain
        run: python3 scripts/tests/verify-container-supply-chain.py
      - uses: docker/setup-buildx-action@v4
      # Exposes the Actions cache token to a raw `docker buildx build`.
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Build tools drive
        run: make -C tools-image build TOOLS_VERSION=0.0.0-ci ARCH=amd64 OUTPUT_DIR="${{ runner.temp }}/agentenv-tools" BUILDX_CACHE_ARGS="--cache-from type=gha,scope=tools-image-amd64 --cache-to type=gha,scope=tools-image-amd64,mode=max,ignore-error=true"

  fmt:
    runs-on: depot-ubuntu-22.04-8
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
        with:
          components: rustfmt
          install_ci_deps: "false"
      - name: Formatting
        run: make fmt

  clippy:
    runs-on: depot-ubuntu-22.04-8
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
        with:
          components: clippy
      - name: Clippy
        run: make clippy

  unit-tests:
    # Ubuntu 24.04's Linux 6.17 kernel can crash in ublk ADD_DEV.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
      - name: Configure ublk test host
        run: sudo scripts/tests/setup-ublk-access.sh "$(id -un)" "$(id -gn)"
      - name: Execution policy and watchdog process tests
        run: cargo test -p runtime-policy
      - name: Unit tests
        run: make test-unit PROFILE=debug
