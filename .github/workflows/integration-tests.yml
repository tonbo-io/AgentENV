name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: "Log level for the tests"
        required: false
  pull_request:
    paths-ignore: &ignore_docs
      - "**.md"
      - "**.rst"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/benchmark.yml"
      - ".github/workflows/e2b-benchmark.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/services-ci.yml"
      - ".github/workflows/mutation-tests.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  push:
    paths-ignore: *ignore_docs

env:
  RUST_LOG: ${{ github.event.inputs.log_level || 'info' }}

permissions:
  contents: read
  packages: read

jobs:
  agentenv-tests:
    # Ubuntu 24.04's Linux 6.17 kernel can crash in ublk ADD_DEV.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Exposes the Actions cache token to a raw `docker buildx build`.
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Build tools drive from this revision
        run: |
          tools_version="0.0.0-ci.g${GITHUB_SHA:0:12}"
          output_dir="${RUNNER_TEMP}/agentenv-tools"
          make -C tools-image build TOOLS_VERSION="$tools_version" ARCH=amd64 OUTPUT_DIR="$output_dir" \
            BUILDX_CACHE_ARGS="--cache-from type=gha,scope=tools-image-amd64 --cache-to type=gha,scope=tools-image-amd64,mode=max,ignore-error=true"
          echo "AENV_TOOLS_VERSION=$tools_version" >> "$GITHUB_ENV"
          echo "AENV_TOOLS_DRIVE_PATH=$output_dir/tools-$tools_version-amd64.ext4" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-ci-setup
        with:
          ci_deps_target: ci-deps
      - uses: ./.github/actions/sandbox-ci-setup
        with:
          ghcr_username: ${{ github.actor }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      - name: AgentEnv Integration tests
        run: sg kvm -c "make test-agent-integration PROFILE=debug"
      - uses: ./.github/actions/sandbox-artifacts-cleanup
        if: always()

  e2e-tests:
    name: e2e-tests (${{ matrix.e2e_name }})
    # Ubuntu 24.04's Linux 6.17 kernel can crash in ublk ADD_DEV.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - e2e_name: single-node
            make_target: test-e2e
          - e2e_name: docker-compose
            make_target: test-e2e-compose
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
        if: ${{ matrix.e2e_name == 'single-node' }}
        with:
          ci_deps_target: ci-deps
      - uses: ./.github/actions/sandbox-ci-setup
        if: ${{ matrix.e2e_name == 'single-node' }}
        with:
          ghcr_username: ${{ github.actor }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure ublk test host
        if: ${{ matrix.e2e_name != 'single-node' }}
        run: sudo scripts/tests/setup-ublk-access.sh "$(id -un)" "$(id -gn)"
      - name: Set up Docker Buildx
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/setup-buildx-action@v4
      - name: Build AgentENV runtime image
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.agentenv
          load: true
          tags: agentenv-runtime:latest
          build-args: |
            AENV_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=agentenv-runtime
          cache-to: type=gha,scope=agentenv-runtime,mode=max,ignore-error=true
      - name: Build gateway image
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.gateway
          load: true
          tags: agentenv-gateway:latest
          cache-from: type=gha,scope=agentenv-gateway
          cache-to: type=gha,scope=agentenv-gateway,mode=max,ignore-error=true
      - name: Build scheduler image
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.scheduler
          load: true
          tags: agentenv-scheduler:latest
          cache-from: type=gha,scope=agentenv-scheduler
          cache-to: type=gha,scope=agentenv-scheduler,mode=max,ignore-error=true
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install e2b CLI
        run: npm install -g @e2b/cli
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install e2b Python SDK
        run: python3 -m pip install --upgrade e2b e2b-code-interpreter
      - name: E2E tests (${{ matrix.e2e_name }})
        run: |
          if [[ "${{ matrix.e2e_name }}" == "single-node" ]]; then
            sg kvm -c "make ${{ matrix.make_target }} PROFILE=debug"
          else
            SKIP_BUILD=1 make ${{ matrix.make_target }} PROFILE=debug
          fi
      - uses: ./.github/actions/sandbox-artifacts-cleanup
        if: always()
