name: Publish Tools Image

on:
  workflow_dispatch:
    inputs:
      tools_version:
        description: Immutable SemVer tag for the tools drive
        required: true
        default: "0.1.0-tonbo.2"
        type: string

jobs:
  validate:
    name: Validate publication
    runs-on: ubuntu-24.04
    outputs:
      envd_repository: ${{ steps.envd_source.outputs.repository }}
      envd_ref: ${{ steps.envd_source.outputs.ref }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Read immutable envd source
        id: envd_source
        run: |
          source tools-image/envd-source.env
          test "$ENVD_REF" = "$(printf '%s' "$ENVD_REF" | grep -E '^[0-9a-f]{40}$')"
          echo "repository=$ENVD_UPSTREAM_REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$ENVD_REF" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version and immutable tag
        env:
          TOOLS_VERSION: ${{ inputs.tools_version }}
        run: |
          make -C tools-image check-tools-version TOOLS_VERSION="$TOOLS_VERSION"
          image="ghcr.io/$OWNER/agentenv-tools:$TOOLS_VERSION"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Refusing to overwrite published tools drive $image." >&2
            exit 1
          fi

  publish-images:
    name: Publish ${{ matrix.platform }} image
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: tools-image
          platforms: ${{ matrix.platform }}
          target: artifact
          build-args: |
            TOOLS_VERSION=${{ inputs.tools_version }}
            ENVD_REF=${{ needs.validate.outputs.envd_ref }}
            ENVD_UPSTREAM_REPO=${{ needs.validate.outputs.envd_repository }}
          tags: ghcr.io/${{ env.OWNER }}/agentenv-tools:${{ inputs.tools_version }}-${{ matrix.arch }}
          push: true

  publish-manifest:
    name: Publish multi-platform manifest
    needs: publish-images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        env:
          TOOLS_VERSION: ${{ inputs.tools_version }}
        run: |
          repository="ghcr.io/$OWNER/agentenv-tools"
          docker buildx imagetools create \
            --tag "$repository:$TOOLS_VERSION" \
            "$repository:$TOOLS_VERSION-amd64" \
            "$repository:$TOOLS_VERSION-arm64"
